[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapidoddsapi"
dynamic = ["version"]
description = "Official Python SDK for RapidOddsAPI: bookmaker odds, live scores and player stats over REST and WebSocket."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "RapidOddsAPI", email = "support@rapidoddsapi.com" }]
keywords = [
    "odds", "odds-api", "betting", "sports-betting", "bookmaker",
    "arbitrage", "sports-data", "live-scores", "websocket",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://rapidoddsapi.com"
Documentation = "https://rapidoddsapi.com/docs"
Repository = "https://github.com/rapidoddsapi/rapidoddsapi-python"

[tool.hatch.version]
path = "src/rapidoddsapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rapidoddsapi"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# typing.Dict and friends stay while 3.9 is supported: the builtin generics
# these rules suggest are only valid in annotations from 3.10.
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
